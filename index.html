<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --fg: #f0ece3;
      --muted: #555;
      --accent: #c8f060;
      --border: #222;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* subtle grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      pointer-events: none;
    }

    .card {
      position: relative;
      max-width: 520px;
      width: 100%;
      border: 1px solid var(--border);
      padding: 3rem 3rem 2.5rem;
      background: #111;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.7s cubic-bezier(.22,.68,0,1.2) 0.2s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .tag {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--accent);
      padding: 0.25rem 0.6rem;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 1.1rem;
    }

    h1 span {
      color: var(--muted);
    }

    p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #888;
      max-width: 38ch;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .progress-bar {
      width: 100%;
      height: 2px;
      background: var(--border);
      margin-top: 1.4rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 2.5s cubic-bezier(.4,0,.2,1);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .counter {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">Maintenance</div>
    <h1>We'll be back<br/><span>shortly.</span></h1>
    <p>Deploying new code to production. The site will be live again in just a few minutes.</p>
    <div class="divider"></div>
    <div class="status-row">
      <div class="dot"></div>
      <span id="status-text">Uploading files...</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="bar"></div>
    </div>
    <div class="progress-label">
      <span id="stage-label">Uploading build</span>
      <span class="counter" id="pct">0%</span>
    </div>
  </div>

  <script>
    // Progress persists across reloads via a cookie (no localStorage needed)
    function getCookie(name) {
      const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return m ? parseFloat(m.pop()) : null;
    }
    function setCookie(name, val) {
      // expires in 30 minutes
      const exp = new Date(Date.now() + 30 * 60 * 1000).toUTCString();
      document.cookie = name + '=' + val + '; expires=' + exp + '; path=/';
    }

    const STAGES = [
      { at: 20,  status: 'Uploading files…',        label: 'Uploading build'     },
      { at: 35,  status: 'Uploading files…',        label: 'Transferring assets' },
      { at: 50,  status: 'Installing dependencies…',label: 'Running npm install' },
      { at: 63,  status: 'Building project…',       label: 'Compiling source'    },
      { at: 75,  status: 'Configuring server…',     label: 'Applying config'     },
      { at: 88,  status: 'Almost there…',           label: 'Final checks'        },
      { at: 97,  status: 'Wrapping up…',            label: 'Finishing touches'   },
    ];

    const INCREMENT_MIN = 7;
    const INCREMENT_MAX = 14;
    const MAX_PROGRESS  = 97;

    // Load saved progress or start at 20
    let saved = getCookie('deploy_progress');
    let base  = (saved !== null) ? saved : 20;

    // Each reload bumps by a random increment (but never beyond MAX)
    if (saved !== null) {
      const bump = INCREMENT_MIN + Math.floor(Math.random() * (INCREMENT_MAX - INCREMENT_MIN + 1));
      base = Math.min(base + bump, MAX_PROGRESS);
    }
    setCookie('deploy_progress', base);

    // Pick the right stage label
    const stage = [...STAGES].reverse().find(s => base >= s.at) || STAGES[0];
    document.getElementById('status-text').textContent = stage.status;
    document.getElementById('stage-label').textContent  = stage.label;

    // Animate bar + counter from 0 → base
    const bar = document.getElementById('bar');
    const pct = document.getElementById('pct');
    const duration = 2200;
    let start = null;

    setTimeout(() => {
      bar.style.width = base + '%';
      function step(ts) {
        if (!start) start = ts;
        const p    = Math.min((ts - start) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        pct.textContent = Math.round(ease * base) + '%';
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }, 300);
  </script>
</body>
</html>
